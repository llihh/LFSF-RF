# VQ Encoder Configuration
# This config defines the frozen VQ-VAE autoencoder used by LFSF.
# Based on RFfusion (NeurIPS 2025).

autoencoder:
  target: lfsf.third_party.ldm.models.autoencoder.VQModel
  ckpt_path: checkpoints/autoencoder.ckpt
  # Paper inference used fp16 VQ encoding on CUDA; CPU falls back to fp32.
  use_fp16: true
  params:
    embed_dim: 3
    n_embed: 8192
    ddconfig:
      double_z: false
      z_channels: 3
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
    lossconfig:
      target: torch.nn.Identity
      params: {}
