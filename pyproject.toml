[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backend"

[project]
name = "lfsf-fusion"
version = "1.0.0"
description = "Latent-Focus Soft Fusion for Multi-Focus Image Stacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0", "numpy>=1.24.0", "scipy>=1.10.0",
  "scikit-image>=0.20.0", "Pillow>=9.0.0", "pyyaml>=6.0",
  "tqdm>=4.64.0", "pandas>=1.5.0", "pytorch-lightning>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
